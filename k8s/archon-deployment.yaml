apiVersion: apps/v1
kind: Deployment

metadata:
  name: archon
  namespace: archon
  labels:
    app: archon
    tier: frontend

spec:
  replicas: 1
  selector:
    matchLabels:
      app: archon

  template:
    metadata:
      labels:
        app: archon
        tier: frontend

    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001

      restartPolicy: Always

      containers:
        - name: archon
          image: archon:latest
          imagePullPolicy: Never

          ports:
            - containerPort: 3000
              protocol: TCP

          envFrom:
            - secretRef:
                name: archon-secrets

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: STORAGE_PATH
              value: "/app/storage/uploads"
            - name: NEXT_TELEMETRY_DISABLED
              value: "1"

          startupProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 30

          livenessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5

          readinessProbe:
            httpGet:
              path: /api/healthz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"

          securityContext:
            allowPrivilegeEscalation: false
            privileged: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL
              add:
                - NET_BIND_SERVICE

          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: next-cache
              mountPath: /app/.next/standalone/archon/.next/cache
            - name: storage
              mountPath: /app/storage/uploads

      volumes:
        - name: tmp
          emptyDir: {}

        - name: next-cache
          emptyDir: {}

        - name: storage
          emptyDir: {}